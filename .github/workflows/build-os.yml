      - name: Download Buildroot
        run: |
          H="https:/"
          G="github.com"
          P="buildroot/buildroot.git"
          git clone --depth 1 --branch 2024.08 "${H}/${G}/${P}"

      - name: Download Pre-compiled Gecko
        run: |
          mkdir -p overlay/opt/gecko
          H="https:/"
          M="download.mozilla.org"
          Q="?product=firefox-esr-latest&os=linux64&lang=en-US"
          wget -O firefox.tar.xz "${H}/${M}/${Q}"
          tar -xf firefox.tar.xz -C overlay/opt/gecko --strip-components=1
          chmod +x overlay/etc/init.d/S99win11
